- title: "Heart Attack Risk Classification"
  url: "https://github.com/optim00s/heart_attack_risk_classification"
  meta: "Python, NumPy, scikit-learn, Matplotlib · July 2026"
  description: >-
    Binary classification pipeline predicting heart attack risk, centered on
    comprehensive exploratory data analysis and robust feature engineering for
    clinical and demographic features. Statistical preprocessing routines
    (missing-value handling, categorical encoding, feature scaling via
    standardization) were implemented from scratch, and multiple architectures
    were optimized through hyperparameter tuning with precision, recall, and
    ROC-AUC trade-off analysis.
