- title: "SAC-QUTAB"
  url: "https://github.com/optim00s/SAC-QUTAB"
  date: "Sept. 2026"
  featured: true
  stack: [PyTorch, Weights & Biases, GitHub Actions]
  summary: "IEEE-style paper comparing ResNet-50 and ViT-Small/16 on EuroSAT RGB."
  points:
    - "Co-authored an IEEE-style paper evaluating ResNet-50 against ViT-Small/16 on EuroSAT RGB across three seeds, quantifying prediction, representation, and calibration sensitivity under RGB-gain, Fourier amplitude-mixing, and resolution-reduction perturbations."
    - "Engineered a modular PyTorch and scikit-learn pipeline featuring deterministic SHA-256 digest tracking, custom feature extraction, and nested logistic regression failure detectors to ensure end-to-end reproducibility across hardware platforms."
    - "Evaluated detector performance with AP and AUROC across six trained checkpoints, driving mean average-precision gains of 0.432 (ResNet-50) and 0.402 (ViT-Small/16) when combining output and representation features."

