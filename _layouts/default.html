<!doctype html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  <a class="skip" href="#about">Skip to content</a>
  <header class="nav">
    <div class="nav__inner">
      <a class="nav__brand" href="#top" aria-label="Back to top">{{ site.data.info.initials }}<span>.</span></a>
      <nav class="nav__links" aria-label="Sections">
        <a href="#about">About</a>
        <a href="#experience">Experience</a>
        <a href="#projects">Projects</a>
        <a href="#education">Education</a>
        <a href="#skills">Skills</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Toggle color theme">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <p>© {{ 'now' | date: "%Y" }} {{ site.data.info.name }}</p>
      <p class="footer__note">Built with Jekyll · hosted on GitHub Pages</p>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
